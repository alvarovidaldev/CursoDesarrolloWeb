<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curso-Desarrollo-Web</title>
  </head>
  <body>
    <!-- SE USA H1 SOLO UNA VEX POR CUESTIONES DE CEO ES DECIR PARA QUE EL MOTOR DE BUSQUEDA NOS MANDE COMO PRIMERO EN LA BUSQUEDA -->

    <!-- LISTAS ORDENADAS -->
     <h1>Listas ordenadas</h1>
    <ol>
      <li>Elemento 1</li>
      <li>Elemento 2</li>
      <li>Elemento 3</li>
      <li>Elemento 4</li>
    </ol>

    <!-- LISTAS NO ORDENADAS -->
    <ul>
      <li>Elemento 1</li>
      <li>Elemento 2</li>
      <li>Elemento 3</li>
      <li>Elemento 4</li>
    </ul>

    <!-- ENLACES -->
                            <!-- target -->
                            <!-- tittle -->
    <a href="https://youtube.com">Enlace normal</a>
    <br />
    <a href="https://youtube.com" target="_self" title="you tube">Enlace con target _self en la misma pestaña</a>
    <br />
    <a href="https://youtube.com" target="_blank">Enlace con target _blanck en otra pestaña</a>
    <br />
    <a href="https://youtube.com" target="_parent">Enlace con target _parent</a>
    <br />
    <a href="https://youtube.com" target="_top">Enlace con target _top </a>



    <!-- IMAGENES -->
     <!-- RUTAS -->
            <!-- src 'La ruta donde esta la imagen' -->
            <!-- alt 'muestra el concepto en caso de que la imagen no cargue' -->
     <img src="....amburguesa1.jpg" alt="amburguesa" title="texto que se muestra al señalar">


     <!-- FORMULARIOS -->
            <!-- require = validacion -->
             <!-- name = como se va llamar este campo para mandar al servidor-->
             <!-- placeholder = texto de ejemplo dentro del campo -->

             <!-- minimo y maximo para la validacion -->
     <form action="">
          <input type="text" required minlength="3" maxlength="10">
          
          <input type="submit" name="boton-enviar">
          <input type="email" name="correo-electronico">
          <input type="password" placeholder="alvaro@gmail.com">
          <input type="checkbox">
          <input type="radio">
          <input type="file">
          <input type="date">
     </form>


     
  </body>
</html>
